<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>鼠洞透视</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 20V11a6 6 0 0112 0v9"/><ellipse cx="12" cy="12" rx="3.1" ry="1.7" fill="#fff" stroke="none"/>
          <circle cx="12" cy="12" r=".95" fill="#0b1220" stroke="none"/>
        </svg>
      </span>
      <div>
        <h1>鼠洞透视</h1>
        <div class="sub" id="top-sub">正在接入…</div>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="mode-pill">X-RAY</span>
    <button class="icon-btn" id="top-refresh" aria-label="刷新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 11a8 8 0 10-2.3 5.6"/><path d="M20 5v6h-6"/>
      </svg>
    </button>
  </header>

  <main id="screen"></main>

  <nav id="tabbar">
    <button class="tab on" data-tab="feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>广场</span><i class="dot"></i>
    </button>
    <button class="tab" data-tab="xray">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/><path d="M11 8v6M8 11h6"/></svg>
      <span>透视</span><i class="dot"></i>
    </button>
    <button class="tab" data-tab="cmd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
      <span>指挥台</span><i class="dot"></i>
    </button>
    <button class="tab" data-tab="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4S18.3 16.4 19.5 20"/></svg>
      <span>我的</span><i class="dot"></i>
    </button>
  </nav>
</div>

<div id="sheet-mask"><div id="sheet"></div></div>

<script src="js/jsQR.js"></script>
<script src="js/core.js"></script>
<script src="js/feed.js"></script>
<script src="js/xray.js"></script>
<script src="js/command.js"></script>
<script src="js/me.js"></script>
<script src="js/app.js"></script>
</body>
</html>
